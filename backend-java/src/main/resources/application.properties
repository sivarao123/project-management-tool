# TaskFlow Spring Boot Configuration
spring.application.name=taskflow-backend

server.port=${PORT:5001}

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:taskflow}
spring.datasource.username=${PGUSER:sivarao}
spring.datasource.password=${PGPASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Jackson JSON Serialization (Matches frontend snake_case contract)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always

# Multipart File Uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application Specific Properties
app.jwt.secret=${JWT_SECRET:taskflow-super-secret-jwt-key-2026}
app.jwt.expiration-ms=604800000
app.upload.dir=${UPLOAD_DIR:uploads}

# Socket.io Configuration (Running concurrently on 9092 or proxied)
socketio.host=0.0.0.0
socketio.port=${SOCKETIO_PORT:9092}

# SpringDoc / Swagger OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
